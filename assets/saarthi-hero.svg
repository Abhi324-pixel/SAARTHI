<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Topographic / GPS Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Constellation / Route overlay in background -->
  <path d="M 120 180 Q 300 80, 520 160 T 900 120 T 1120 220" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-dasharray="6,6" stroke-width="2" />
  <circle cx="120" cy="180" r="4" fill="#10b981" opacity="0.4" />
  <circle cx="520" cy="160" r="5" fill="#f59e0b" opacity="0.5" />
  <circle cx="900" cy="120" r="4" fill="#8b5cf6" opacity="0.4" />
  <circle cx="1120" cy="220" r="6" fill="#06b6d4" opacity="0.6" />

  <!-- Compass / Pin Graphic -->
  <g transform="translate(85, 95)">
    <!-- Outer radar rings -->
    <circle cx="55" cy="55" r="50" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5" />
    <circle cx="55" cy="55" r="35" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="55" cy="55" r="20" fill="#0f172a" stroke="url(#gold-grad)" stroke-width="2.5" />
    <!-- Pin Point -->
    <path d="M 55 25 C 43 25, 35 34, 35 46 C 35 62, 55 83, 55 83 C 55 83, 75 62, 75 46 C 75 34, 67 25, 55 25 Z" fill="url(#gold-grad)" filter="url(#glow)" />
    <circle cx="55" cy="45" r="7" fill="#0f172a" />
  </g>

  <!-- Title & Branding -->
  <text x="230" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1">
    SAARTHI <tspan fill="#f59e0b">AI</tspan>
  </text>
  <text x="232" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
    GOOGLE MAPS FOR LEARNING
  </text>
  <text x="232" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400">
    Self-Generating, Adaptive Knowledge Graph Navigation &amp; Practical Vakh Integration
  </text>

  <!-- Feature Pill Badges -->
  <g transform="translate(230, 210)">
    <!-- Badge 1: BKT Source of Truth -->
    <rect x="0" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#10b981" />
    <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">BKT Mastery Truth</text>

    <!-- Badge 2: Knowledge Graph -->
    <rect x="190" y="0" width="185" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="206" cy="17" r="4" fill="#38bdf8" />
    <text x="218" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Relational Graph</text>

    <!-- Badge 3: Dynamic Detours -->
    <rect x="385" y="0" width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="401" cy="17" r="4" fill="#f59e0b" />
    <text x="413" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Adaptive Detours</text>

    <!-- Badge 4: Vakh Practical Layer -->
    <rect x="565" y="0" width="190" height="34" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
    <circle cx="581" cy="17" r="4" fill="#a855f7" />
    <text x="593" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc">Vakh Verified Builds</text>

    <!-- Badge 5: Explainability -->
    <rect x="765" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="781" cy="17" r="4" fill="#ec4899" />
    <text x="793" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Audit Trail (vN)</text>
  </g>

  <!-- Bottom Coordinates Banner -->
  <g transform="translate(0, 315)">
    <rect width="1200" height="45" fill="#030712" fill-opacity="0.6" />
    <text x="50" y="28" font-family="Courier, monospace" font-size="12" fill="#64748b">
      NAV_STATUS: <tspan fill="#10b981">ONLINE</tspan> &nbsp; | &nbsp; GRAPH_NODES: <tspan fill="#f59e0b">MULTI-RELATIONAL</tspan> &nbsp; | &nbsp; ENGINE: <tspan fill="#38bdf8">FASTAPI + BKT</tspan> &nbsp; | &nbsp; VERIFIED: <tspan fill="#a855f7">VAKH PRACTICAL LAYER</tspan>
    </text>
    <text x="1050" y="28" font-family="Courier, monospace" font-size="12" fill="#f59e0b" font-weight="700">
      v2.0 PRODUCTION
    </text>
  </g>
</svg>
